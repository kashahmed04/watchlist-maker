name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: create env file
      run: |
        touch .env
        echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
        echo "REDISCLOUD_URL=${{ secrets.REDISCLOUD_URL }}" >> .env
        echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
    - name: Debug Secrets
      run: |
        if [ -z "${{ secrets.MONGODB_URI }}" ]; then
          echo "MONGODB_URI is undefined"
        else
          echo "MONGODB_URI is defined"
        fi
    - name: Debug .env
      run: cat .env
    - name: Install dependencies
      run: npm ci
    - name: Create Report Directory
      run: mkdir -p ${GITHUB_WORKSPACE}/tests/e2e/playwright-report
    - name: Run Playwright tests
      run: npx playwright test ${GITHUB_WORKSPACE}/tests/e2e/watchlist.spec.js
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: ${GITHUB_WORKSPACE}/tests/e2e/playwright-report/
        retention-days: 30
