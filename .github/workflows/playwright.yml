name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: create env file
      run: |
        touch .env
        echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
        echo "REDISCLOUD_URL=${{ secrets.REDISCLOUD_URL }}" >> .env
        echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
    - name: Install dependencies
      run: npm ci
    - name: Create Report Directory
      run: mkdir -p ${GITHUB_WORKSPACE}/tests/e2e/playwright-report
    - name: Start Node Server in Background
      run: npm start &
    - name: Wait for Server to Start
      run: sleep 10
    - name: Run Playwright tests
      run: npx playwright test ${GITHUB_WORKSPACE}/tests/e2e/watchlist.spec.js
    - name: Stop Server
      run: kill $(lsof -t -i:3000)
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: ${GITHUB_WORKSPACE}/tests/e2e/playwright-report/
        retention-days: 30
