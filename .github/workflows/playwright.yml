name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Create env file
      run: |
        touch .env
        echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
        echo "REDISCLOUD_URL=${{ secrets.REDISCLOUD_URL }}" >> .env
        echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
    - name: Install dependencies
      run: npm ci
    - name: Start Node Server in Background
      run: npm start > server.log 2>&1 &
    - name: Wait for Server to Start
      run: |
        for i in {1..30}; do
          if nc -zv localhost 3000; then
            echo "Server is up!"
            break
          fi
          echo "Waiting for server to start..."
          sleep 1
        done
    - name: Debug Server Logs
      run: cat server.log
    - name: Check Server Accessibility
      run: curl -I http://localhost:3000/
    - name: Run Playwright tests
      run: npx playwright test
    - name: Stop Server
      run: kill $(lsof -t -i:3000)
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: ${GITHUB_WORKSPACE}/tests/e2e/playwright-report/
        retention-days: 30
